name: Historical backtest

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm test
      - name: Run public Bybit historical backtest
        env:
          BACKTEST_DAYS: '180'
          BACKTEST_SYMBOLS: XRPUSDT,BTCUSDT,ETHUSDT,SOLUSDT
          BACKTEST_OUTPUT: backtest-report.json
        run: npm run backtest
      - uses: actions/upload-artifact@v4
        with:
          name: maxincome-historical-backtest
          path: backtest-report.json
          if-no-files-found: error
          retention-days: 14
