name: PAPER safety checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm test
      - name: Syntax check
        run: |
          node --check server.js
          node --check src/paper-trader.js
          node --check src/risk-guards.js
          node --check src/trading-engine.js
