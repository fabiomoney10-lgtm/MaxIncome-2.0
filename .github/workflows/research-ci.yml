name: Research CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/backtest.js'
      - 'src/research-strategies.js'
      - 'src/research-backtest.js'
      - 'scripts/**'
      - 'package.json'
      - 'test/**'
      - 'docs/entry-calibration.md'
      - '.github/workflows/research-ci.yml'
  push:
    branches: ['research/entry-calibration-hardening']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check src/backtest.js
          node --check src/research-strategies.js
          node --check test/backtest.test.js
          node --check test/research-strategies.test.js
      - name: Run complete test suite
        run: npm test
      - name: Research runner availability note
        run: echo "Historical data collection is a separate local run because Bybit restricts US-based API source IPs."
