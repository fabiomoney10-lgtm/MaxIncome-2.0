name: MaxIncome checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/paper-risk-controls]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: node --check server.js && node --check src/paper-trader.js && node --check src/trading-engine.js && node --check src/risk-manager.js
